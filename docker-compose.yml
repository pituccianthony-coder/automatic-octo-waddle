# docker-compose.yml

version: '3.8'

services:
  # Наш основной сервис, бэкенд EchoVoid.
  # Мы называем его "oracle", потому что он будет предсказывать... или создавать... реальность.
  oracle:
    # Собираем образ из нашего Dockerfile.
    build: .
    # Имя контейнера для удобства.
    container_name: echovoid_oracle
    # Пробрасываем порты, чтобы мы могли общаться с ним из нашего мира.
    ports:
      - "8000:8000"
    # Монтируем код бэкенда в контейнер.
    # Это позволяет нам изменять код на лету, и он будет меняться внутри контейнера.
    # Божественный уровень "hot-reloading".
    volumes:
      - ./backend:/app
    # Имя хоста внутри сети Docker.
    hostname: oracle
    # Перезапускаем его, если он вдруг умрет. Бессмертие — опция.
    restart: unless-stopped

# Здесь в будущем появятся другие сервисы:
# - Фронтенд на Next.js
# - База данных (возможно, векторная)
# - Локальный узел блокчейна для тестов
# Но пока что достаточно одного оракула.
