# docker-compose.yml

version: '3.8'

services:
  oracle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echovoid_oracle
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - echovoid_net

  portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echovoid_portal
    ports:
      - "3000:3000"
    depends_on:
      - oracle
    restart: unless-stopped
    networks:
      - echovoid_net

networks:
  echovoid_net:
    driver: bridge
