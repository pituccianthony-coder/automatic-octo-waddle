version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital_sanctuary_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - sanctuary_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital_sanctuary_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sanctuary_net

networks:
  sanctuary_net:
    driver: bridge
